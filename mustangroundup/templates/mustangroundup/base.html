{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#13315c">
    <link rel="manifest" href="{% url 'manifest' %}">
    <link rel="stylesheet" href="{% static 'css/roundup.css' %}">
    <title>{% block title %}Mustang Roundup{% endblock %}</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{% url 'dashboard' %}">Mustang Roundup</a>
      <nav class="topnav" aria-label="Main navigation">
        <a href="{% url 'judge_login' %}">Judge</a>
        <a href="{% url 'results' %}">Results</a>
        {% if request.user.is_staff %}
          <a href="{% url 'dashboard' %}">Dashboard</a>
          <a href="{% url 'diagnostics' %}">Diagnostics</a>
          <a href="{% url 'admin:index' %}">Admin</a>
        {% endif %}
      </nav>
    </header>

    {% if messages %}
      <aside class="messages" aria-live="polite">
        {% for message in messages %}
          <div class="message message-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </aside>
    {% endif %}

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/pwa.js' %}" defer></script>
  </body>
</html>
