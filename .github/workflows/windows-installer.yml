name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish, such as v0.1.0"
        required: false
        type: string
  push:
    branches:
      - main
      - master
      - codex/local-first-django-rebuild
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\packaging\windows\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustangRoundup-Setup
          path: dist/installer/MustangRoundup-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $tag = "${{ inputs.release_tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "Release tag is required."
          }

          $assetPath = "dist\installer\MustangRoundup-Setup.exe"
          $assetName = "MustangRoundup-Setup.exe"
          if (-not (Test-Path -LiteralPath $assetPath)) {
              throw "Installer not found at $assetPath"
          }

          $repository = "${{ github.repository }}"
          $apiRoot = "https://api.github.com/repos/$repository"
          $uploadRoot = "https://uploads.github.com/repos/$repository"
          $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $notes = @"
          Unsigned Windows installer for Mustang Roundup.

          Windows SmartScreen may show a warning because this app is not code-signed. Click More info, then Run anyway.
          "@

          try {
              $release = Invoke-RestMethod -Method Get -Uri "$apiRoot/releases/tags/$tag" -Headers $headers
          } catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              if ($statusCode -ne 404) {
                  throw
              }

              $body = @{
                  tag_name = $tag
                  target_commitish = "${{ github.sha }}"
                  name = "Mustang Roundup $tag"
                  body = $notes
                  draft = $false
                  prerelease = $false
              } | ConvertTo-Json
              $release = Invoke-RestMethod -Method Post -Uri "$apiRoot/releases" -Headers $headers -Body $body -ContentType "application/json"
          }

          $existingAsset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if ($existingAsset) {
              Invoke-RestMethod -Method Delete -Uri "$apiRoot/releases/assets/$($existingAsset.id)" -Headers $headers | Out-Null
          }

          $uploadUri = "$uploadRoot/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($assetName))"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/octet-stream" -InFile $assetPath | Out-Null
          Invoke-RestMethod -Method Get -Uri "$apiRoot/releases/tags/$tag" -Headers $headers
